name: hygiene

on:
  pull_request:
  push:
    branches: [main]

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      # On pull_request the default checkout is a preview merge commit that GitHub builds on the
      # fly; it carries an identity the author never chose, so the guard runs on the real head.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Commit messages, identities and tracked text
        env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}
        run: |
          head="${{ github.event.pull_request.head.sha || github.sha }}"
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          # On push, "before" is all zeros for a new branch and unknown to this clone after a
          # history rewrite. Then every commit reachable from the head is checked, so nothing
          # passes unseen. A pull request always has a real base.
          if git rev-parse -q --verify "$base^{commit}" >/dev/null 2>&1; then
            bash scripts/hygiene.sh "$base" "$head"
          else
            bash scripts/hygiene.sh --all "$head"
          fi
      - name: Secret scan
        run: |
          curl -sSL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks detect --source . --no-banner --redact
          ./gitleaks detect --source . --no-banner --redact --no-git
