name: hygiene

on:
  pull_request:
  push:
    branches: [main]

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Commit messages, identities and tracked text
        env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          bash scripts/hygiene.sh "$base" "${{ github.sha }}"
      - name: Secret scan
        run: |
          curl -sSL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks detect --source . --no-banner --redact
          ./gitleaks detect --source . --no-banner --redact --no-git
