<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keviq Live demo</title>
<link rel="stylesheet" href="/static/console.css">
</head>
<body>
<header><h1>Keviq Live · demo</h1><span class="muted">replay sessions on this server</span></header>
<main style="grid-template-columns:1fr">
  <section>
    <h2>Sessions</h2>
    <div id="sessions" class="muted">loading…</div>
    <p class="muted">Start one with <code>make replay SESSION=demo1</code>; it appears here.</p>
  </section>
</main>
<script>
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  async function load() {
    const { sessions } = await (await fetch("/api/sessions")).json();
    document.getElementById("sessions").innerHTML = sessions.length
      ? sessions.map((s) => `<div class="item"><div class="row"><b>${esc(s.session_id)}</b><span class="muted">${s.events} events</span></div>
          <a href="/console/${encodeURIComponent(s.session_id)}">console</a> · <a href="/overlay/${encodeURIComponent(s.session_id)}">overlay</a></div>`).join("")
      : "no sessions yet";
  }
  load(); setInterval(load, 5000);
</script>
</body>
</html>
