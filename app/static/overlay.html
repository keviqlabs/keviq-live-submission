<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="overlay.title">Live card overlay</title>
<link rel="stylesheet" href="/static/shared.css">
</head>
<body class="overlay-body">
<!-- Transparent page for a vertical (9:16) broadcast source: the newest live card, right side,
     upper-middle third. Width from ?size=30|36|43 (default 36). No comments, hearts or input box
     are drawn here. Language from ?lang= (set by the console link), else the stored choice, else English. -->
<div class="stage" id="stage" data-card-size="36">
  <div class="overlay-stack">
    <div class="overlay-product" id="card" hidden>
      <div class="mini-top"><span class="mini-version mono" id="version"></span><span class="mini-state" id="state"></span></div>
      <img id="img" alt="" hidden>
      <h2 id="name"></h2>
      <div class="old-price" id="old-price" hidden></div>
      <div class="new-price" id="price"></div>
      <div class="mini-stock" id="meta"></div>
    </div>
    <div class="overlay-toast" id="toast" hidden></div>
  </div>
  <button type="button" class="overlay-hide" id="hide" hidden></button>
</div>
<script src="/static/i18n.js"></script>
<script src="/static/overlay.js"></script>
</body>
</html>
